[package]
name = "rust_lib_violet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
sevenz-rust = { version = "0.6.1" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ahash = "0.8"

[dev-dependencies]
tokio = { version = "1.38.2" }
